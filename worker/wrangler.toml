name = "skopje-drive-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Durable Objects hold the accounts, the workspaces and the rate limits
[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "Account"

[[durable_objects.bindings]]
name = "WORKSPACES"
class_name = "Workspace"

[[durable_objects.bindings]]
name = "LIMITS"
class_name = "Limiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Account", "Workspace", "Limiter"]

[vars]
ALLOWED_ORIGIN = "https://vstruminikovski.github.io"
ADMINS = "viktor"
SIGNUPS_PER_MIN = "60"
SIGNINS_PER_MIN = "120"
