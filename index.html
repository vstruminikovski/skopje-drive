<!doctype html>
<html lang="mk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4efe6" />
    <title>Скопје · Дебар Маало</title>
    <style>
      :root { --ink: #1f2a33; --muted: #5d6b76; --card: #fffdf8; --line: #e6dccb; --accent: #000; --accent-2: #000; color-scheme: light; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ink: #eef1f4; --muted: #aab4bd; --card: #1d2228; --line: #33393f; --accent: #f08a5a; --accent-2: #5fb8a6; color-scheme: dark; } }
      :root[data-theme="dark"] { --ink: #eef1f4; --muted: #aab4bd; --card: #1d2228; --line: #33393f; --accent: #f08a5a; --accent-2: #5fb8a6; color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body { font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: #fff; display: grid; place-items: center; padding: 16px; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body { background: radial-gradient(1200px 600px at 10% -10%, #3a2a20 0%, transparent 60%), #15191d; } }
      main { width: min(680px, 100%); text-align: center; }
      h1 { font-size: clamp(26px, 5vw, 36px); margin: 0 0 6px; letter-spacing: -0.01em; }
      p.lead { color: var(--muted); margin: 0 0 28px; }
      .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      @media (max-width: 560px) { .choices { grid-template-columns: 1fr; } }
      a.card { display: block; text-decoration: none; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 0; padding: 22px 20px; min-height: 48px;  transition: transform .15s ease, border-color .15s ease; }
      a.card:hover, a.card:focus-visible { transform: translateY(-2px); border-color: var(--accent); outline: none; }
      .icon { font-size: 34px; line-height: 1; margin-bottom: 12px; }
      a.card h2 { font-size: 20px; margin: 0 0 6px; }
      a.card p { margin: 0; color: var(--muted); font-size: 15px; }
      a.play h2 { color: var(--accent); }
      a.build h2 { color: var(--accent-2); }
      footer { margin-top: 26px; color: var(--muted); font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Скопје · Дебар Маало</h1>
      <p class="lead">Избери што сакаш да правиш.</p>
      <div class="choices">
        <a class="card play" href="./play/">
          <div class="icon" aria-hidden="true">🚗</div>
          <h2>Играј ја играта</h2>
          <p>Вози низ Скопје</p>
        </a>
        <a class="card build" href="./build/">
          <div class="icon" aria-hidden="true">🪧</div>
          <h2>Градител</h2>
          <p>Додавај и бриши знаци и зачувај ги во играта</p>
        </a>
      </div>
      <footer>Карта: © OpenStreetMap contributors</footer>
    </main>
  </body>
</html>
