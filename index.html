<!doctype html>
<html lang="mk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <title>SkopjeDrive</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="loading">
      <div class="bar"><i></i></div>
      <div class="pct"></div>
      <small class="credit">Карта: © соработниците на OpenStreetMap</small>
      <p class="error-text"></p>
      <a class="back" data-go="home" href="#">Назад</a>
    </div>
    <a id="menuBtn" class="menu-btn ui glass" href="./?menu=1" hidden>‹ Мени</a>

    <div id="pick" class="ui" hidden>
      <main class="home">
        <h1>SkopjeDrive</h1>
        <p class="home-sub">Вози низ Скопје.</p>
        <button id="guest" class="btn btn-primary btn-lg" type="button">Играј ја играта</button>
        <nav class="list home-more" aria-label="Повеќе">
          <a id="build" class="row" data-go="build" href="#">
            <span class="row-main"><span class="row-title">Гради ја играта</span><span class="row-sub">Знаци, ознаки и семафори</span></span>
            <span class="chev" aria-hidden="true"></span>
          </a>
          <button id="load" class="row" type="button">
            <span class="row-main"><span class="row-title">Вчитај моја игра</span><span id="loadSub" class="row-sub">Најави се за да ја отвориш</span></span>
            <span class="chev" aria-hidden="true"></span>
          </button>
        </nav>
        <p id="acct" class="home-foot" hidden><span id="acctName"></span><span aria-hidden="true"> · </span><button id="logout" class="link" type="button">Одјави се</button></p>
        <p id="phoneNote" class="home-foot" hidden>Отвори го на компјутер за да додаваш знаци, ознаки и семафори.</p>
      </main>
    </div>

    <div id="pickGame" class="scrim ui" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pickTitle">
        <button id="pickClose" class="sheet-x" type="button" aria-label="Затвори">✕</button>
        <h2 id="pickTitle">Која игра да се игра?</h2>
        <div id="pickList" class="stack"></div>
      </div>
    </div>

    <div id="signin" class="scrim ui" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="signinTitle">
        <button id="signinClose" class="sheet-x" type="button" aria-label="Затвори">✕</button>
        <h2 id="signinTitle">Вчитај моја игра</h2>
        <p>Најави се и твојата игра се отвора на секој компјутер.</p>
        <div id="authBox"></div>
      </div>
    </div>

    <script type="module" src="/src/play/main.ts"></script>
  </body>
</html>
