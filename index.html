<!doctype html>
<html lang="mk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#f5f5f7" />
    <title>SkopjeDrive</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="loading">
      <div class="bar"><i></i></div>
      <div class="pct"></div>
      <small class="credit">Карта: © OpenStreetMap contributors</small>
      <p class="error-text"></p>
      <a class="back" data-go="home" href="#">← Назад</a>
    </div>
    <a id="menuBtn" class="menu-btn" href="./?menu=1" hidden>Мени</a>
    <div id="pick" hidden>
      <div class="pick-card">
        <h1>SkopjeDrive</h1>
        <button id="guest" class="pick-btn" type="button">Играј ја играта</button>
        <p id="who" class="pick-sub" hidden></p>
        <button id="logout" class="pick-back" type="button" hidden>Одјави се</button>
        <a id="build" class="pick-btn pick-alt" data-go="build" href="#">Гради ја играта</a>
        <p class="pick-sub">Додавај знаци и ознаки</p>
        <button id="load" class="pick-btn pick-alt" type="button">Вчитај моја игра</button>
        <form id="signin" autocomplete="on" hidden>
          <input id="pUser" placeholder="корисничко име" autocomplete="username" required>
          <input id="pPass" type="password" placeholder="лозинка" autocomplete="current-password" required>
          <div id="pTurnstile"></div>
          <button type="submit" class="pick-btn">Најави се</button>
          <button type="button" id="pRegister" class="pick-btn pick-alt">Создај нов профил</button>
          <button type="button" id="pBack" class="pick-back">← Назад</button>
          <p id="pErr" class="pick-err" role="alert"></p>
        </form>
        <p id="phoneNote" class="phone-note" hidden>Отвори го на компјутер за да додаваш знаци, ознаки и семафори.</p>
      </div>
    </div>
    <script type="module" src="/src/play/main.ts"></script>
  </body>
</html>
