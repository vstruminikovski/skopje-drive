<!doctype html>
<html lang="mk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#f5f5f7" />
    <title>Играј · Скопје</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="loading">
      <div class="bar"><i></i></div>
      <div class="pct"></div>
      <small class="credit">Карта: © OpenStreetMap contributors</small>
      <p class="error-text"></p>
      <a class="back" href="../">← Назад</a>
    </div>
    <div id="pick" hidden>
      <div class="pick-card">
        <h1>SkopjeDrive</h1>
        <button id="guest" class="pick-btn">Играј ја играта</button>
        <p class="pick-or">или</p>
        <form id="signin" autocomplete="on">
          <input id="pUser" placeholder="корисничко име" autocomplete="username" required>
          <input id="pPass" type="password" placeholder="лозинка" autocomplete="current-password" required>
          <div id="pTurnstile"></div>
          <button type="submit" class="pick-btn">Најави се и играј со мојата работа</button>
          <button type="button" id="pRegister" class="pick-btn pick-alt">Создај нов профил</button>
          <p id="pErr" class="pick-err" role="alert"></p>
        </form>
      </div>
    </div>
    <script type="module" src="/src/play/main.ts"></script>
  </body>
</html>
