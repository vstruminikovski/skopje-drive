<!doctype html>
<html lang="mk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#f5f5f7" />
    <title>Играј · Скопје</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="loading">
      <div class="bar"><i></i></div>
      <div class="pct"></div>
      <small class="credit">Карта: © OpenStreetMap contributors</small>
      <p class="error-text"></p>
      <a class="back" data-go="home" href="#">← Назад</a>
    </div>
    <a id="menuBtn" class="menu-btn" href="./?menu=1" hidden>Мени</a>
    <div id="pick" hidden>
      <div class="pick-card">
        <h1>SkopjeDrive</h1>
        <button id="guest" class="pick-btn" type="button">Играј ја играта</button>
        <a id="build" class="pick-btn pick-alt" data-go="build" href="#">Гради ја играта</a>
        <button id="load" class="pick-btn pick-alt" type="button">Вчитај моја игра</button>
        <div id="signinWrap" hidden>
          <div id="authBox"></div>
          <button type="button" id="pBack" class="pick-back">← Назад</button>
        </div>
        <section id="mine" class="mine" hidden aria-live="polite">
          <p class="mine-who">Најавен си како <b id="mineUser"></b></p>
          <p id="mineStatus" class="mine-status"></p>
          <button id="minePlay" class="pick-btn" type="button" hidden>Играј ја мојата игра</button>
          <a id="mineEdit" class="pick-btn pick-alt" data-go="build" href="#">Уреди ја во градителот</a>
          <button id="logout" class="pick-back" type="button">Одјави се</button>
        </section>
        <p id="phoneNote" class="phone-note" hidden>Отвори го на компјутер за да додаваш знаци, ознаки и семафори.</p>
      </div>
    </div>
    <script type="module" src="/src/play/main.ts"></script>
  </body>
</html>
